
name: Build Uang Keluarga APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Extract project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP tidak ditemukan di repositori."
            exit 1
          fi
          echo "Menggunakan file: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted
          cp -a extracted/. .

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Uang-Keluarga-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
